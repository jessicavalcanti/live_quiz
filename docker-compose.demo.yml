# Levanta uma versão já entregue (app + banco + e-mail) isolada do ambiente de
# desenvolvimento. Use sempre pelo script `bin/demo`, que define o project name
# e o worktree da tag.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: live_quiz_demo
    volumes: ["demo_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    # Local por padrão, como no ambiente de desenvolvimento: a caixa de entrada
    # da demonstração não precisa estar acessível na rede.
    ports: ["127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"]

  app:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://postgres:postgres@db/live_quiz_demo
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-demo-secret-key-base-com-no-minimo-64-caracteres-para-a-demonstracao-local}
      GUARDIAN_SECRET_KEY: ${GUARDIAN_SECRET_KEY:-demo-guardian-secret-key-apenas-para-a-demonstracao-local}
      # As contas da demonstração têm senha publicada. Elas só existem porque
      # esta variável pede por elas, e ela só é definida aqui.
      DEMO_SEED: "true"
      # O endereço que participantes vão abrir. Para uma demonstração em LAN,
      # aponte `PHX_HOST` para um nome que os aparelhos resolvam e `DEMO_PORT`
      # para a porta publicada — o link e o QR code saem daqui.
      PHX_HOST: ${PHX_HOST:-localhost}
      PHX_SCHEME: ${PHX_SCHEME:-http}
      PHX_URL_PORT: ${DEMO_PORT:-4000}
      PORT: "4000"
      # O relay aberto ao lado é da demonstração, e agora precisa dizer isso:
      # sem SMTP_MODE=demo a release exige credenciais de um provedor real (R07).
      SMTP_MODE: demo
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    # A aplicação é o único serviço que uma demonstração em LAN precisa expor, e
    # ainda assim só quando alguém pede: `DEMO_BIND=0.0.0.0` junto com um
    # `PHX_HOST` que os aparelhos consigam resolver.
    ports: ["${DEMO_BIND:-127.0.0.1}:${DEMO_PORT:-4000}:4000"]
    command: >
      sh -c "bin/live_quiz eval 'LiveQuiz.Release.migrate(); LiveQuiz.Release.seed()' &&
             bin/live_quiz start"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:4000/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  demo_pgdata:
