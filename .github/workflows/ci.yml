name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  MIX_ENV: test
  MINIMUM_COVERAGE: "80"

jobs:
  guard-main:
    name: Proteção da main
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Somente a develop pode ser mergeada na main
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "::error::PRs para a main só são aceitos a partir da branch develop (recebido: ${{ github.head_ref }})."
            exit 1
          fi
          echo "Origem válida: develop -> main"

  quality:
    name: Lint e cobertura
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: live_quiz_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: A aplicação Phoenix já existe?
        id: app
        run: |
          if [ -f mix.exs ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Ainda não existe mix.exs. O pipeline completo passa a rodar a partir da story F1-01."
          fi

      - uses: erlef/setup-beam@v1
        if: steps.app.outputs.exists == 'true'
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - uses: actions/cache@v4
        if: steps.app.outputs.exists == 'true'
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Dependências
        if: steps.app.outputs.exists == 'true'
        run: mix deps.get

      - name: Formatação
        if: steps.app.outputs.exists == 'true'
        run: mix format --check-formatted

      - name: Compilação sem warnings
        if: steps.app.outputs.exists == 'true'
        run: mix compile --warnings-as-errors

      - name: Análise estática (Credo)
        if: steps.app.outputs.exists == 'true'
        run: mix credo --strict

      - name: Testes com cobertura mínima de 80%
        if: steps.app.outputs.exists == 'true'
        run: mix coveralls
